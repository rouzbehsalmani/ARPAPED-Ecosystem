# Authoritative, language-agnostic descriptor of this ecosystem's Evolution
# pillar (self-improvement over time) -- the peer of bridge/MANIFEST.yaml's
# Runtime pillar (bridge/), never nested inside it: this folder holds only
# what belongs to the self-improving cycle itself, not to the execution
# boundary it uses. Docs never name a file directly -- they point here
# instead. If any piece below is ever built, reimplemented, or
# restructured, update ONLY this file (and the implementation itself); no
# document elsewhere in this Blueprint needs to change.
#
# The cycle process and its record formats are NOT owned by this folder:
# they are shared, stable ecosystem definitions -- 1-CYCLE.md at the repo
# root, schemas/ alongside the Bridge's own schemas -- the same posture
# bridge/MANIFEST.yaml already takes toward schemas/ ("pure data-structure
# definitions... live in the stable top-level schemas/"). This file exists
# to name where DEP's OWN artifacts -- the accumulated record store and
# whatever learns from it -- actually live, once they exist. Nothing here
# duplicates 1-CYCLE.md or the schemas; it only points at them.
dep:
  process:
    location: 1-CYCLE.md
    role: >
      The Self-Improving Cycle every DEP episode records one run of --
      Phase 0 (Bootstrap) through Phase 9 (Return state), each phase citing
      the 2-RULES.md invariant(s) it enforces. Not owned by this pillar
      alone: the Bridge (Runtime) is itself resolved and used within this
      same cycle (Phase 0 gates 1-3, Phase 6 gate 27) -- the cycle is what
      binds the two pillars into one ecosystem, not a DEP-only artifact.
  cycle_input:
    location: schemas/agent-cycle-input.schema.json
    role: >
      What one cycle starts from: current_state + goal (1-CYCLE.md "Cycle
      input").
  decision_record:
    location: schemas/agent-cycle-report.schema.json
    role: >
      The process of decision, recorded: one entry per responsibility
      (reuse/compose/split_refactor/create + reason, Phase 2/4), the
      capabilities created or reused (Phase 5), and the verification
      outcome and resulting state the next cycle starts from (Phase 7-9).
      This is what a "historical episode" concretely is.
  verification_record:
    location: schemas/verification-record.schema.json
    role: >
      Real execution evidence, not a self-report: every capability-operation
      check carries the Bridge's own observed response.trace, copied never
      invented (2-RULES.md R8, Gate 28) -- the point where this pillar's
      own record and the Runtime pillar's actual execution meet.
  episode_store:
    location: dep/episode_store.py
    role: >
      Durable, accumulating corpus of completed cycles -- one directory
      per episode under dep/episodes/, keyed by the verification_record's
      own verification_id (no new identifier scheme invented). Both
      records are schema-validated (jsonschema, against decision_record/
      verification_record above) before being written; an episode is
      never silently overwritten. This is what was missing for
      "historical episodes" to be more than a phrase in 1-CYCLE.md Phase
      9 -- somewhere they actually accumulate across cycles, not just
      within one.
  dataset_builder:
    location: dep/dataset_builder.py
    role: >
      Walks the episode_store corpus and emits dep/dataset.jsonl, one row
      per decision (not per episode) -- a cycle can decompose a goal into
      several independently-decided responsibilities (Phase 2/4), and
      `decision`/`reason` are what a future predictor is meant to
      predict, given goal/starting_state/responsibility, with the
      episode's verification_status/resulting_state carried on every row
      as the outcome that decision led to. Regenerable from the corpus at
      any time, the same relationship bridge/samples/hello_world's
      capability-catalog.jsonl has to the manifests it was built from.
  jepa:
    role: >
      NOT YET BUILT. The agent that does the implementation job (Phase 5
      Generate, and the Diagnose/Plan phases that precede it) -- improved
      from the dataset_builder's output, so each cycle's Diagnose/Plan/
      Generate steps benefit from every prior one (Phase 9 "Return state"
      made cumulative across cycles, not just sequential within one).
