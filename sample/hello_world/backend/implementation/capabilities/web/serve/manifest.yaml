# Sample capability manifest, valid against sample/schemas/capability-manifest.schema.json.
# Co-located with its executor, per R3.
#
# executor_kind: factory -- declares console.write as a dependency
# (../../../contracts/web.serve.contract.yaml) and needs live access to it
# to dispatch an incoming remote request, so its executor is a factory:
# (dependencies) -> executor, invoked once at assembly time. See executor.py.
capability_id: web.serve
contract: sample/hello_world/backend/implementation/contracts/web.serve.contract.yaml
contract_version: "1.0.0"
implementations:
  - implementation_id: web.serve.default
    version: "1.0.0"
    operations: [start, stop]
    executor: sample.hello_world.backend.runtime.capabilities.web.serve.executor:make_executor
    executor_kind: factory
    priority: 100
