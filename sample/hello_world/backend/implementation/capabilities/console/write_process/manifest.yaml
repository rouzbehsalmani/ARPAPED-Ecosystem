# Sample capability manifest, valid against sample/schemas/capability-manifest.schema.json.
#
# A THIRD implementation of console.write 2.0.0 (alongside ../write/ at
# 1.0.0 and ../write_v2/ at 2.0.0), running out-of-process
# (executor_kind: process) instead of in-process -- proves the process
# executor protocol is language-neutral even for Python itself. Written
# in Python for this example, but the name identifies the mechanism
# (out-of-process), not the language -- see ../../greeting/compose_process/
# for the same proof in a different language (whichever one it happens to
# be implemented in; that choice is that manifest's own business, not
# named here, so this comment never goes stale when it changes). Uses
# clients/python/bridge_client.py -- that sibling's own client library
# plays the same role for it.
#
# `executor:` is an argv list, not a single command string, since an
# interpreted language needs an interpreter AND a script
# (sample/hello_world/backend/runtime/bridge/process_executor.py, ProcessExecutorPool).
#
# priority is below console.write.v2's (200), reachable only via its own
# declared name (app/dependencies.yaml's console_write_process), never
# silently becoming the default.
capability_id: console.write
contract: sample/hello_world/backend/implementation/contracts/console.write.contract.yaml
contract_version: "2.0.0"
implementations:
  - implementation_id: console.write.process
    version: "2.0.0"
    operations: [write]
    executor_kind: process
    executor: ["python", "sample/hello_world/backend/runtime/capabilities/console/write_process/executor.py"]
    priority: 150
