# Sample capability manifest, valid against sample/schemas/capability-manifest.schema.json.
#
# A SECOND implementation of greeting.compose, running out-of-process
# (executor_kind: process) instead of in-process, same contract as
# ../compose/manifest.yaml -- proves a process-kind capability can call
# ANOTHER capability through the Bridge too (R4/R5 nested-call
# protocol), not just answer the Bridge's own calls. Inherits the
# contract's dependencies.capabilities (console.write) automatically.
# Written in C# for this worked example (see README "A capability in
# another language"), but the name identifies the mechanism
# (out-of-process), not the language.
#
# priority is below greeting.compose.default's (100) -- reachable only
# via its own declared name (app/dependencies.yaml's
# greeting_compose_process), never silently becoming the default.
#
# A real .NET console-app project (GreetingComposeProcess.csproj,
# Program.cs), referencing BridgeClient (clients/csharp/, a
# ProjectReference). NOT built automatically -- from this directory:
#   dotnet build --output ../../../../runtime/capabilities/greeting/compose_process/bin
# places the binary at bin/greeting_compose_process[.exe], gitignored.
capability_id: greeting.compose
contract: sample/hello_world/backend/implementation/contracts/greeting.compose.contract.yaml
contract_version: "1.0.0"
implementations:
  - implementation_id: greeting.compose.process
    version: "1.0.0"
    operations: [compose]
    executor_kind: process
    executor: sample/hello_world/backend/runtime/capabilities/greeting/compose_process/bin/greeting_compose_process.exe
    priority: 50
