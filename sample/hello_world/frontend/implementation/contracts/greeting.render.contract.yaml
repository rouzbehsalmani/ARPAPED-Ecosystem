# Sample contract artifact, valid against sample/schemas/component-contract.schema.json.
# Part of the hello-world sample's frontend (../../README.md). Owned by frontend/ --
# NOT a second implementation of backend/implementation/contracts/greeting.compose.contract.yaml.
# The two look similar (both "make a greeting for a name") because this
# sample keeps the toy domain small, but that resemblance is exactly what
# earlier attempts wrongly took as "same capability, two runtimes" -- in
# real practice, a frontend-facing and backend-facing shape almost never
# turn out identical (view/display concerns vs domain/persistence
# concerns), so this contract is free to diverge from greeting.compose's
# on its own terms: it returns the composed text (for display), which
# greeting.compose never needed to. Depends on backend's console.write BY
# ID (dependencies.capabilities, R4) -- a normal cross-capability
# reference, not a shared contract file; nothing here duplicates
# console.write's own contract, which stays solely owned by backend/.
contract:
  identity:
    id: greeting.render
    name: Greeting Render
    version: "1.0.0"
    domain: greeting
    family: render
    type: capability
  responsibility:
    description: Composes a greeting message for a name, logs it via the remote console.write capability, and returns the text for display.
    invariants:
      - does not modify its input
  versions:
    "1.0.0":
      operations:
        - name: render
          description: Builds a greeting for the given name, logs it through console.write, and returns the composed text.
          input:
            - name: name
              type: string
              required: true
              pattern: "\\S"
              description: Name to greet.
          output:
            type: object
            description: "{message: string} -- the composed greeting text, for the frontend to display."
          errors: []
  dependencies:
    capabilities:
      - capability_id: console.write
        contract_version: ">=1.0.0,<2.0.0"
    components: []
    resources: []
  discoverability:
    tags: [greeting, frontend, ui]
    metadata: {}
  versioning:
    compatibility: backward
    deprecation_policy: none
  lineage:
    created_by: walkthrough-sample
    changed_by: walkthrough-sample
    history: []
