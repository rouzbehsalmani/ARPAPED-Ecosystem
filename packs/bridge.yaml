# Bridge pillar pack -- the copy-paste manifest for a new project that
# wants ONLY the Bridge's loosely-coupled, contract-and-manifest
# capability execution model, with no self-development cycle (Cycles
# pillar) and no episode/training recording (DEP pillar).
#
# The Python (backend) / JavaScript (frontend) code below is this
# Blueprint's own REFERENCE implementation, not the only language it can
# exist in: nothing about the Bridge/Registry/Policy/Selector
# architecture (2-RULES.md Bridge/Bridge Core glossary) or the
# contract/manifest/protocol shapes it validates against
# (starterkit/schemas/, language-agnostic) is Python- or
# JavaScript-specific. If the language chosen for a runtime's own Bridge
# (packs/README.md "Starting the Bootstrap agent") differs from the
# reference, treat the files below as the SPECIFICATION to port from --
# same four-stage pipeline (validate -> discover -> policy -> select ->
# execute), same observed trace shape, same schemas validated against --
# not a copy-paste target. This is an INDEX either way, never a
# duplicate: nothing else in this repo defines the architecture
# differently, whichever language actually implements it. Adopting this
# pack means copying (or porting) these real paths into your new
# project's own tree, never importing them live from here (2-RULES.md
# R9/Gate 35: a Bridge is copied per application, never shared at
# runtime across independent applications). If this pack's own contents
# are ever restructured, update ONLY this file -- no document elsewhere
# in the Blueprint needs to change (same posture as
# blueprint/dep/MANIFEST.yaml toward its own tools).
pack: bridge
pillar: Bridge
description: >
  A loosely-coupled, contract-and-manifest capability execution model:
  every capability execution goes through one canonical Bridge over
  contract-shaped data (discovery -> policy -> selection -> execution,
  with a full observed trace). Adopt this alone for that composition
  discipline -- swappable, independently-discoverable implementations
  behind one contract -- with no cycle process and no DEP recording.

files:
  required:
    agent_orientation:
      - AGENTS.md
      # Not Bridge-specific -- entry-point orientation any agent working
      # in a project descended from this Blueprint needs, regardless of
      # pillar combination, including the pointer to check
      # state/ecosystem-resolution.json before re-deriving what a
      # Bootstrap agent already resolved. Required by all three packs
      # (packs/dep.yaml, packs/cycles.yaml, this one) -- deliberate
      # overlap, same posture dep.yaml/cycles.yaml already share on
      # checkpoint.py/ecosystem_resolution.py.
    schemas:
      - starterkit/schemas/
      # component-contract, capability-manifest, capability-catalog,
      # implementation-record, discovery-key, bridge-protocol,
      # bridge-trace, process-executor-protocol -- all 8 files here
      # belong to this pack; nothing under starterkit/schemas/ belongs to
      # any other pillar. Needed regardless of which runtime(s) or
      # language(s) below are chosen -- every Bridge, in any language,
      # validates against these same shapes; porting a Bridge to a new
      # language never means porting these too.
  choose_at_least_one:
    # Driven by `app_runtimes` -- backend, frontend, or both
    # (packs/README.md "Starting the Bootstrap agent") -- asked for EVERY
    # pillar combination, not just this one, since it describes the
    # application's own shape; here it also picks which of the two
    # entries below to copy. Never assume backend just because it's
    # the more detailed of the two to resolve. A frontend-only ecosystem
    # is a real, valid choice (e.g. a browser-only app whose capabilities
    # are all Local, with no backend at all); so is backend-only; so is
    # both, wired together exactly as starterkit/ demonstrates.
    #
    # Each chosen runtime ALSO needs its own answer to
    # `bridge_language_backend`/`bridge_language_frontend` (packs/README.md,
    # same section) -- open question, no offered menu beyond the
    # reference. backend's reference is Python, frontend's is JavaScript:
    # an answer matching the reference means copy the files below
    # directly; a different answer means port them into that language
    # instead (see this file's own header comment for what must carry
    # over unchanged). Record whichever language was actually used in the
    # ecosystem-resolution record's own `pillars.bridge.runtimes[].language`
    # (ecosystem-resolution-record.schema.json) -- never left implicit.
    backend:
      # implementation/ before runtime/ -- same order every Layout
      # section in this Blueprint already lists them in (R7
      # contract -> manifest -> code; build-time precedes run-time):
      - starterkit/backend/implementation/build_catalog.py
      # NOT optional -- without this, there is no way to turn your own
      # capabilities' contracts/manifests into the runtime/
      # capability-catalog.jsonl the engine below reads at startup, at
      # all. Generic logic (just walks implementation/capabilities/ and
      # implementation/contracts/ relative to itself, both empty in a
      # fresh project until you add your own), but its OWN import --
      # `from starterkit.backend.runtime.bridge.assembler import
      # rebuild_catalog` -- is hardcoded to this repo's own package name
      # and MUST be rewritten to your new project's own package path;
      # this is real, required editing, not a verbatim copy, even when
      # the chosen language matches the reference (Python) exactly.
      # Lands as a sibling of runtime/ (implementation/build_catalog.py
      # next to runtime/bridge/) -- see this file's own worked_example
      # note below for the full folder shape.
      - starterkit/backend/runtime/bridge/
      # bridge.py, registry.py, policy.py, selector.py, assembler.py,
      # process_executor.py, MANIFEST.yaml -- the whole engine, one
      # piece. Self-contained: only relative imports (.registry,
      # .policy, ...) inside this folder, nothing importing "starterkit"
      # -- copying it verbatim needs zero import adjustment.
    frontend:
      - starterkit/frontend/implementation/build_catalog.py
      # NOT optional, same reason as backend's own copy above: without
      # it there is no way to build runtime/capability-catalog.jsonl
      # from your own implementation/capabilities/**/manifest.json +
      # implementation/contracts/ (both empty until you add your own).
      # Pure Node/JS, no import path to rewrite (unlike backend's own
      # copy) -- it locates everything relative to itself and to
      # ../../schemas/ (this pack's own schemas/ entry above), nothing
      # hardcoded to this repo's own package/module name.
      - starterkit/frontend/runtime/bridge/
      # core.js, assembler.js, remote_client.js, MANIFEST.yaml -- the
      # JS Bridge Core, for a browser (or other JS) runtime with its own
      # resolved Bridge.
  optional:
    out_of_process_python_client:
      - starterkit/backend/runtime/clients/python/bridge_client.py
      - starterkit/backend/runtime/clients/python/direct_adapter.py
      # NOT part of the Bootstrap question flow -- no fixed question asks
      # "what language will an out-of-process capability be in," because
      # that's a per-capability implementation decision made later, by
      # whoever writes that specific capability, not a whole-ecosystem
      # answer to settle upfront. Relevant only if backend was chosen,
      # and only for OUT-OF-PROCESS capabilities (executor_kind: process)
      # -- a plain in-process capability in the backend Bridge's own
      # language needs nothing extra here. Copy these two once a real
      # out-of-process capability actually needs a Python client: the
      # reference client, and direct_adapter.py's prepared-ahead-of-need
      # role if the Bridge itself is ever reimplemented in a different
      # language.
    out_of_process_csharp_client:
      - starterkit/backend/implementation/clients/csharp/BridgeClient.cs
      - starterkit/backend/implementation/clients/csharp/BridgeClient.csproj
      # Same situation, for a capability that needs a C# client instead --
      # never the obj/ build output alongside these two files, that's
      # generated.
    # Answer was something else entirely? No reference client exists yet
    # for it. The wire protocol itself is language-agnostic
    # (starterkit/schemas/process-executor-protocol.schema.json, already
    # copied above) -- port it into that language using either client
    # above as a worked example (starterkit/backend/README.md "Neither
    # client hand-rolls its own connect/frame/dispatch logic"). Nothing
    # more to copy for an unlisted language; this is real work, not a
    # copy-paste, same as porting the Bridge itself.

rules:
  # Pointer, never a duplicate copy -- read these sections in place,
  # don't fork their text into this pack. blueprint/2-RULES.md's own
  # "Scope: which rules are Bridge-scoped" section already tags exactly
  # which numbered rules/gates apply to this pack alone.
  - blueprint/2-RULES.md: "R1-R9, the Bridge/Registry/Policy/Selector
      glossary entries, and the Verification contract's Bridge-scoped
      items (trace/selection/evidence) -- see that file's own 'Scope'
      section for the precise list."

worked_example: starterkit/
# Copy the SHAPE from here too, not just this pack's own files -- and
# for a chosen runtime, this is now load-bearing, not just convention:
# `implementation/build_catalog.py` above depends on landing as a
# SIBLING of `runtime/` (both directly under your project's own
# `backend/` or `frontend/`, exactly as `starterkit/backend/` and
# `starterkit/frontend/` each already split), and the frontend copy
# additionally depends on `frontend/` and `schemas/` (this pack's own
# schemas entry above) landing as SIBLINGS of each other one level up --
# get either wrong and build_catalog.py's own relative-path computation
# breaks. Also copy the shape of: the file order (contract -> manifest
# -> executor), the single request-construction point pattern
# (runtime/app/requests.py). See starterkit/backend/README.md. If the
# Bridge itself was ported to another language, the SHAPE still applies
# -- only the engine's own implementation language changed.

combine_with:
  cycles: >
    Adopting the Cycles pillar too (packs/cycles.yaml)? Nothing extra
    to add here -- blueprint/1-CYCLE.md's own "Scope" section activates
    every Bridge-scoped gate automatically once this pack's files exist
    in your project; nothing in this pack changes.
  dep: >
    Adopting the DEP pillar too (packs/dep.yaml)? Pass a
    blueprint.dep.runtime_log.RuntimeEventLog instance as this Bridge's
    own `event_sink` constructor argument (see bridge.py's own
    docstring) to get every real call recorded automatically -- entirely
    optional, duck-typed (bridge.py never imports blueprint.dep), the
    Bridge runs identically with or without it. If this runtime's
    Bridge was ported to a non-Python language, `runtime_log.py` itself
    stays Python-only (it's DEP-pillar tooling, not part of the Bridge)
    -- wiring an event_sink from a non-Python Bridge means porting
    RuntimeEventLog's own small schema-validated record/append logic
    too, or having that Bridge call the Python one over some boundary
    of your own choosing; this pack takes no position on which.
