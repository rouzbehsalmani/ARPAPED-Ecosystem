# Starter kit contract artifact, valid against starterkit/schemas/component-contract.schema.json.
# Part of the starter kit's backend (../../README.md). Only backend/ ever
# implements or resolves this one -- the frontend's remote client just
# POSTs to a URL string, it never resolves web.serve as a capability --
# but that's carried by the generated capability catalogs (only
# backend/capability-catalog.jsonl has an entry for it), not by a
# separate contracts/ area: R3's "co-located, no separate area" is about
# not scattering across different owning APPLICATIONS (why bridge/ isn't
# shared across applications), not a reason to sub-split one already-small
# application's own contracts/ by which of its runtimes happens to implement
# each one.
#
# The backend's Remote-execution entry point (2-RULES.md R4 executor_kind:
# remote): starts an HTTP listener exposing a
# starterkit/schemas/bridge-protocol.schema.json-shaped POST endpoint, so a
# DIFFERENT runtime's own Bridge Adapter (e.g. the frontend's JS one) can
# reach this backend's Bridge over a real network boundary -- not a spawned
# sibling process (that's `process`/Worker), a genuinely separate runtime.
# Declares log.write as a dependency so its factory executor can dispatch
# an incoming remote request to it via the Dependencies/nested-call
# mechanism (R4), never importing the Bridge directly.
#
# Serves ONLY /bridge -- an API, nothing else. It used to also serve the
# frontend's static files as a same-process convenience; that conflated
# two unrelated responsibilities (backend/frontend served on ONE server)
# purely because it was easy to wire that way. Backend and frontend are
# each served separately now (see ../../../README.md "Two servers, not one")
# -- frontend hosting is deliberately NOT a capability here: nothing can
# resolve a capability through a Bridge before its own hosting page has
# already loaded, so "serve this runtime's own static files" can never be
# reached through the same request-construction point it exists to serve
# (R6) -- it is a deployment/hosting concern this Blueprint does not
# model, the same way it never models the process manager that runs the
# backend itself.
contract:
  identity:
    id: web.serve
    name: Web Serve
    version: "1.0.0"
    domain: web
    family: serve
    type: capability
  responsibility:
    description: Starts an HTTP server exposing this backend's Bridge to another runtime over the network -- an API endpoint only, no static file serving.
    invariants:
      - only dispatches capabilities it explicitly declared as dependencies
      - never executes a capability outside its declared dependency list
  versions:
    "1.0.0":
      operations:
        - name: start
          description: Starts the HTTP server on the given host/port, exposing a bridge-protocol POST endpoint at /bridge; verifies it is reachable before returning.
          input:
            - name: host
              type: string
              required: false
              default: 127.0.0.1
            - name: port
              type: integer
              required: false
              default: 0
          output:
            type: object
            description: "{url: string} -- the base URL the server is actually reachable at."
          errors:
            - code: ALREADY_RUNNING
              description: start was called while a previous server this executor started is still running.
        - name: stop
          description: Stops the running HTTP server. A clean no-op if nothing is running.
          input: []
          output:
            type: object
            description: Empty object on success.
          errors: []
  dependencies:
    capabilities:
      - capability_id: log.write
        contract_version: ">=1.0.0,<2.0.0"
    components: []
    resources: []
  discoverability:
    tags: [web, remote, bridge-adapter]
    metadata: {}
  versioning:
    compatibility: backward
    deprecation_policy: none
  lineage:
    created_by: walkthrough-starterkit
    changed_by: walkthrough-starterkit
    history: []
