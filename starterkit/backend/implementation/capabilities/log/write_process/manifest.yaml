# Starter kit capability manifest, valid against starterkit/schemas/capability-manifest.schema.json.
#
# A SECOND implementation of log.write, running out-of-process
# (executor_kind: process) instead of in-process -- proves a capability
# can be implemented in a genuinely different language (R4/R5). Written
# in C# for this worked example (see README "A capability in another
# language"), but the name identifies the mechanism (out-of-process),
# not the language.
#
# priority is below log.write.default's (100) -- reachable only via its
# own declared name (app/dependencies.yaml's log_write_process), never
# silently becoming the default.
#
# A real .NET console-app project (LogWriteProcess.csproj, Program.cs),
# referencing BridgeClient (../../clients/csharp/, a ProjectReference).
# NOT built automatically -- from this directory:
#   dotnet build --output ../../../../runtime/capabilities/log/write_process/bin
# places the binary at bin/log_write_process[.exe], gitignored.
capability_id: log.write
contract: starterkit/backend/implementation/contracts/log.write.contract.yaml
contract_version: "1.0.0"
implementations:
  - implementation_id: log.write.process
    version: "1.0.0"
    operations: [write]
    executor_kind: process
    executor: starterkit/backend/runtime/capabilities/log/write_process/bin/log_write_process.exe
    priority: 50
