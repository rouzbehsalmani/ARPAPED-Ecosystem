# Starter kit capability manifest, valid against starterkit/schemas/capability-manifest.schema.json.
# Co-located with its executor, per R3.
#
# priority: 100, higher than ../write_process/'s 50 -- wins any unpinned
# resolve; the process-kind implementation stays reachable only by
# whoever explicitly pins it (app/dependencies.yaml's log_write_process).
capability_id: log.write
contract: starterkit/backend/implementation/contracts/log.write.contract.yaml
contract_version: "1.0.0"
implementations:
  - implementation_id: log.write.default
    version: "1.0.0"
    operations: [write]
    executor: starterkit.backend.runtime.capabilities.log.write.executor:execute
    priority: 100
