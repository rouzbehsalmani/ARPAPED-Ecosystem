# Starter kit contract artifact, valid against starterkit/schemas/component-contract.schema.json.
# Part of the starter kit's frontend (../../README.md). Owned by frontend/ --
# NOT a second implementation of backend/implementation/contracts/log.write.contract.yaml.
# The two share an operation shape (message/level) because this starter
# kit keeps the toy domain small, but they are genuinely different
# capabilities: this one's job is "take a client-side event and report
# it," the backend's is "actually write the line" -- in real practice a
# frontend-facing and backend-facing shape almost never turn out
# identical, so this contract is free to diverge from log.write's on its
# own terms. Depends on backend's log.write BY ID (dependencies.capabilities,
# R4) -- a normal cross-capability reference, not a shared contract file;
# nothing here duplicates log.write's own contract, which stays solely
# owned by backend/.
contract:
  identity:
    id: client.log
    name: Client Log
    version: "1.0.0"
    domain: client
    family: log
    type: capability
  responsibility:
    description: Reports a client-side event to the backend, which actually writes it via the remote log.write capability.
    invariants:
      - does not modify its input
  versions:
    "1.0.0":
      operations:
        - name: report
          description: Sends message/level to the backend's log.write over the network.
          input:
            - name: message
              type: string
              required: true
              description: The log line's own text.
            - name: level
              type: string
              required: false
              default: info
              enum: [info, warn, error]
              description: Severity level -- "info" (default), "warn", or "error".
          output:
            type: object
            description: Empty object on success.
          errors: []
  dependencies:
    capabilities:
      - capability_id: log.write
        contract_version: ">=1.0.0,<2.0.0"
    components: []
    resources: []
  discoverability:
    tags: [client, log, frontend, ui]
    metadata: {}
  versioning:
    compatibility: backward
    deprecation_policy: none
  lineage:
    created_by: walkthrough-starterkit
    changed_by: walkthrough-starterkit
    history: []
