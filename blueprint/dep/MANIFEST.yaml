# Authoritative, language-agnostic descriptor of this ecosystem's Evolution
# pillar (self-improvement over time) -- describing tooling that belongs to
# the methodology zone (`blueprint/`), never to the resolved/concrete zone
# (`sample/`, which holds sample/hello_world/backend/runtime/bridge/ -- the Runtime pillar this cycle
# uses -- and every worked sample). This folder holds only what belongs to
# the self-improving cycle itself, not to the execution boundary it uses.
# Docs never name a file directly -- they point here instead. If any piece
# below is ever built, reimplemented, or restructured, update ONLY this
# file (and the implementation itself); no document elsewhere in this
# Blueprint needs to change.
#
# The cycle process and its record formats are NOT owned by this folder:
# they are shared, stable definitions -- 1-CYCLE.md, a sibling of this
# folder under blueprint/, and blueprint/schemas/ (the self-development
# schemas: cycle input/report, verification record, checkpoint) -- kept
# separate from sample/schemas/ (the bridge-related schemas: contract,
# manifest, protocol, catalog), the same posture sample/hello_world/backend/runtime/bridge/MANIFEST.yaml
# takes toward its own half of the split ("pure data-structure
# definitions... live in the stable `sample/schemas/`"). This file exists
# to name where DEP's OWN artifacts -- the accumulated record store and
# whatever learns from it -- actually live, once they exist. Nothing here
# duplicates 1-CYCLE.md or the schemas; it only points at them.
dep:
  process:
    location: 1-CYCLE.md
    role: >
      The Self-Improving Cycle every DEP episode records one run of --
      Phase 0 (Bootstrap) through Phase 9 (Return state), each phase citing
      the 2-RULES.md invariant(s) it enforces. Not owned by this pillar
      alone: the Bridge (Runtime) is itself resolved and used within this
      same cycle (Phase 0 gates 1-3, Phase 6 gate 27) -- the cycle is what
      binds the two pillars into one ecosystem, not a DEP-only artifact.
  cycle_input:
    location: blueprint/schemas/agent-cycle-input.schema.json
    role: >
      What one cycle starts from: current_state + goal (1-CYCLE.md "Cycle
      input").
  decision_record:
    location: blueprint/schemas/agent-cycle-report.schema.json
    role: >
      The process of decision, recorded: one entry per responsibility
      (reuse/compose/split_refactor/create + reason, Phase 2/4), the
      capabilities created or reused (Phase 5), and the verification
      outcome and resulting state the next cycle starts from (Phase 7-9).
      This is what a "historical episode" concretely is. `resulting_state`
      is the live, discoverable path the next cycle starts from; the
      OPTIONAL sibling `resulting_state_ref` (state_ref below) is an
      immutable identifier for that same state's content at THIS cycle's
      completion, so an old episode's own historical state stays
      reconstructable after later cycles go on to mutate `resulting_state`'s
      own path.
  verification_record:
    location: blueprint/schemas/verification-record.schema.json
    role: >
      Real execution evidence, not a self-report: every capability-operation
      check carries the Bridge's own observed response.trace, copied never
      invented (2-RULES.md R8, Gate 28) -- the point where this pillar's
      own record and the Runtime pillar's actual execution meet. Also
      carries `environment` (the platform this run actually executed on,
      captured once per run -- OS/arch/runtime, never assumed) and, per
      check, `input` (the actual value that check's capability operation
      was called with) -- without both, a check's own observations
      (trace/selection/evidence/expected/actual) are unreproducible from
      the record alone.
  process_supervisor:
    location: blueprint/dep/process_supervisor.py
    role: >
      Generic start/stop for a background process an agent must reliably
      stop later -- e.g. a dev/test server started during Phase 7 Verify
      (2-RULES.md R5: ongoing/background work must be verified,
      synchronously and promptly, to have actually started, never
      assumed). `start(argv, pidfile, ready_check, ready_timeout)` /
      `stop(pidfile)`, `pidfile` the only state carried between them --
      call both directly wherever a process is actually started or
      stopped, in whatever script or harness needs to (0-WALKTHROUGH.md
      section 6); this is not something an application wraps in its own
      start/stop scripts, since `argv` (what to launch -- any language)
      and `ready_check` (how THIS process signals ready -- a port, a
      file, a log line, anything) are specific to the process being
      supervised, not to this tool. Fixes a real, observed failure mode:
      a background process started without this (a detached shell
      command, `Start-Process -PassThru`, a bare `subprocess.Popen`)
      keeps running after the command that launched it ends, invisible,
      still holding its port -- the next restart then talks to whichever
      orphaned process happens to still be listening, not the one just
      started.
  checkpoint:
    location: blueprint/dep/checkpoint.py
    role: >
      Mid-cycle progress record -- blueprint/schemas/cycle-checkpoint.schema.json --
      so an agent interrupted anywhere in Phase 0-8 (tokens, network,
      crash, any reason unrelated to the work itself) can be resumed by a
      DIFFERENT agent without reverse-engineering filesystem state.
      Tracked per-responsibility (`planned` -> `decided` ->
      `contract_written` -> `manifest_written` -> `code_written` ->
      `integrated`, Phase 2/4/5/6), not just per-phase: knowing "Phase 5"
      alone doesn't tell a resuming agent which of several decomposed
      responsibilities are actually done. `save_checkpoint(checkpoint,
      checkpoint_path)` / `load_checkpoint(checkpoint_path)` /
      `clear_checkpoint(checkpoint_path)`, called wherever Phase 0-8
      actually runs (0-WALKTHROUGH.md). Mutable and overwritten
      repeatedly through one cycle attempt, unlike an episode -- cleared
      once the cycle reaches Phase 8 and `episode_store.save_episode`
      succeeds (Gate 31/32), since the episode is then the permanent
      record. Generic like episode_store: no default
      `checkpoint_path` here -- always given explicitly by the caller
      (e.g. state/cycle-checkpoint.json, alongside its
      state/verification-record.json). Carries `ecosystem_resolution_ref`
      and, per responsibility, `artifacts` (contract/manifest/executor
      paths) -- not status labels alone -- so a resuming agent opens the
      exact files directly instead of falling back to a project-wide scan
      to trust the label (Gate 33). Observed for real: an agent resumed a
      stopped process successfully but at high cost, by scanning the
      whole project, because it had nothing this cheap to resume from --
      the bounded-lookup discipline Gates 4/5 already require of
      capability discovery, applied here to resuming a cycle. Resume cost
      MUST scale with the number of responsibilities in this checkpoint
      alone, never with how many capabilities the wider project already
      has -- a project with hundreds of capabilities resumes exactly as
      cheaply as one with a handful, because a resuming agent never
      touches the project as a whole, only the paths this file names.
      `reconcile_with_catalog(checkpoint, catalog_path)` handles the other
      real failure mode observed: a checkpoint that went STALE because
      work happened without `save_checkpoint` being called to record it
      (found once at `current_phase: "0-bootstrap"`/every responsibility
      `planned` while 8 capabilities already existed). Cross-checks each
      responsibility against the application's own
      `capability-catalog.jsonl` -- the same bounded index Phase 3
      discovery reads -- filling in `artifacts` and advancing `status` to
      at least `code_written` wherever the catalog proves it, in O(this
      cycle's own capability count); never invents `integrated`, never
      regresses a status already further along, and never reads the
      project itself. The caller must `save_checkpoint` the reconciled
      result immediately, or this exact repair repeats on the next
      interruption (Gate 34).
      `reconcile_with_filesystem(checkpoint, contracts_dir,
      capabilities_dir, search_roots=None)` covers the same staleness
      before a catalog exists to reconcile against -- also observed for
      real, mid-Phase-5: a checkpoint frozen at Phase 0 while 7 contracts
      and 5 of 7 executors already existed. Uses R1's own naming
      convention for the contract/manifest paths (a manifest is tried as
      either `.yaml` or `.json`, since which one depends on the runtime's
      own language, e.g. Node has no built-in YAML) -- still O(this
      checkpoint's own responsibility count), no file contents read
      beyond the manifest itself once found. A manifest's own `executor:`
      locator is resolved differently per language/executor_kind (a
      Python `module:attr` string resolves from the application root; a
      plain relative path resolves from whatever root that runtime's own
      assembler uses) -- this function has no privileged knowledge of any
      one language's rule, so it tries the locator against each of
      `search_roots` (default: just the application root) and the caller
      supplies whichever roots its own application actually resolves
      executors from (e.g. both the repo root and a runtime/ root, for an
      application with the implementation/runtime split); under-resolving
      is safe, this mechanism only ever claims what's genuinely proven.
      Catches what a raw status-bump would hide: a file sitting where a
      manifest would name it, before any manifest exists there at all, is
      an R7 order violation (Gate 26), recorded as a `blocker` rather than
      silently advanced past `manifest_written`. A responsibility that is
      a second implementation of an EXISTING contract (no contract file of
      its own) is resolved via its own manifest's declared `contract:`
      field instead of the naming-convention guess, once that manifest is
      found.
  episode_store:
    location: blueprint/dep/episode_store.py
    role: >
      Durable, accumulating corpus of completed cycles -- one directory
      per episode under a caller-given `episodes_dir`, keyed by the
      verification_record's own verification_id (no new identifier
      scheme invented). Both records are schema-validated (jsonschema,
      against decision_record/verification_record above) before being
      written; an episode is never silently overwritten. Generic, like
      a sample's own assembler: has no opinion on WHERE a corpus lives --
      `episodes_dir` is always given explicitly, never defaulted to a
      path inside blueprint/dep/ itself. An application's own episodes belong
      under that application (e.g. sample/hello_world/backend/state/episodes/,
      alongside its verification-record.json), the same way its own
      capability-catalog.jsonl belongs under it, not inside sample/hello_world/backend/runtime/bridge/. This
      is what was missing for "historical episodes" to be more than a
      phrase in 1-CYCLE.md Phase 9 -- somewhere they actually accumulate
      across cycles, not just within one.
  finish_cycle:
    location: blueprint/dep/finish_cycle.py
    role: >
      The single publish-time gate that closes two confirmed enforcement
      gaps at once, because they were never really two separate problems:
      Gate 31 (1-CYCLE.md Phase 8) had no automated enforcement connecting
      a schema-valid verification_record to an actual episode --
      episode_store's own save operation was called from exactly one file
      in this repo's entire sample/ tree, and even that caller never
      called checkpoint's own clear operation either, leaving two
      separately-rememberable steps where one was reliably forgotten --
      and Gate 30/R4's acyclic dependency-graph claim (2-RULES.md) had no
      implementation anywhere, in blueprint/dep/ or in any sample's own
      assembler. `finish_cycle(cycle_report, verification_record,
      catalog_path, episodes_dir, checkpoint_path=None)` refuses to do
      anything at all unless verification_record["status"] == "verified"
      (an unverified state is never published, 2-RULES.md "Fail closed" --
      not a new invariant, just finally enforced at the one place a cycle
      is actually published from) and unless the dependency graph declared
      across catalog_path's own `dependencies` edges (the same
      capability-catalog.jsonl shape checkpoint's own
      catalog-reconciliation operation already reads) is acyclic --
      naming the exact cycle found (e.g. "a -> b -> a") rather than a bare
      pass/fail, since Gate 30 asks an agent to go fix a specific cycle,
      not just learn one exists. Only past both refusals does it call
      episode_store's own save operation, then checkpoint's own clear
      operation if a checkpoint_path was given -- unchanged, still the
      same two underlying operations, just no longer two
      separately-callable, separately-forgettable ones.
      `finish_cycle_from_paths(cycle_report_path, verification_record_path,
      catalog_path, episodes_dir, checkpoint_path=None)` is the same
      contract for a caller with these two records as files rather than
      already-loaded dicts, and `python -m blueprint.dep.finish_cycle
      --cycle-report PATH --verification-record PATH --catalog PATH
      --episodes-dir PATH [--checkpoint PATH]` is its CLI, exit 0 with
      the new episode directory on stdout or exit 1 with why not on
      stderr -- the part that actually closes the second half of the
      Gate 31 gap: a harness written in any language other than Python
      (a frontend's own verify.js, Gate 19) has no way to import a
      Python module, but can always shell out to this CLI as a
      subprocess, the same way it already has to invoke anything else
      outside its own language. Deliberately the one place in
      blueprint/dep/ that DOES require its catalog_path to already exist
      and be parseable (raises FinishCycleError otherwise) rather than
      treating a missing catalog as "nothing to check" the way
      checkpoint's own catalog-reconciliation operation does for its
      different, best-effort, mid-cycle purpose -- by the time
      finish_cycle is called (Phase 8, after this cycle's own
      capabilities are already registered and the catalog rebuilt to
      include them), a missing catalog is a caller error, not a normal
      state to tolerate silently. Called from Phase 8 (1-CYCLE.md), after
      registration, never from the Phase 7 harness itself
      (0-WALKTHROUGH.md section 6) -- the acyclic check needs this
      cycle's own new capabilities' edges already in the catalog, which
      registration is what puts there.
  state_ref:
    location: blueprint/dep/state_ref.py
    role: >
      An immutable identifier for `resulting_state`'s own content at the
      moment a cycle completes (agent-cycle-report.schema.json's
      `resulting_state_ref`) -- fixes `resulting_state` being a live path
      string that LATER cycles go on to mutate, which otherwise makes an
      old episode's own historical state unreconstructable from the
      episode alone. `capture_state_ref(paths, repo_root=None)` returns
      `{"content_hash": "sha256:...", "vcs": {...}?}`: `content_hash` is a
      deterministic sha256 over every file reachable from the given
      `paths` (caller-supplied, e.g. this cycle's own contracts/
      capabilities/generated catalog -- never a default that walks an
      entire application tree, and never `state/episodes/` itself, which
      would make the hash depend on its own prior output), sensitive to
      added/removed/renamed files, not just changed bytes -- ALWAYS
      computable, no external tool required. `vcs` is OPTIONAL
      supplementary git identity (commit/branch/dirty), populated only by
      a real, non-fatal `git rev-parse HEAD` probe against `repo_root`
      when one is given and actually resolves to a real git working
      tree -- silently omitted, never raised, otherwise. This is the
      concrete form of the operator's own instruction: DEP may reference
      Git commits/branches when relevant, but must never DEPEND on Git as
      its storage model -- `content_hash` alone is what makes historical
      reconstruction work for every episode, `vcs` is a convenience
      layered on top for the ones that happened to run inside a git
      working tree.
  dataset_builder:
    location: blueprint/dep/dataset_builder.py
    role: >
      Walks a given episode corpus and emits a dataset.jsonl, one row per
      decision (not per episode) -- a cycle can decompose a goal into
      several independently-decided responsibilities (Phase 2/4), and
      `decision`/`reason` are what a future predictor is meant to
      predict, given goal/starting_state/responsibility, with the
      episode's verification_status/resulting_state carried on every row
      as the outcome that decision led to. Also pulls a decision's own
      structured `failure`/`correction` (agent-cycle-report.schema.json)
      when present, and, via the decision's own `check_ids`, the
      `selection`/`evidence`/`trace`/`input` objects (2-RULES.md glossary)
      the matching verification-record.json checks actually observed --
      real Bridge-level Decision Context, Evidence, and per-check input,
      joined explicitly by id, never guessed by matching a responsibility
      name against a check's description string. Also carries
      `environment` (verification-record.schema.json, once per row) and
      `resulting_state_ref` (state_ref above) when the episode's harness
      captured them -- both optional, since an episode recorded before
      either field existed in the schema simply omits them. Generic, same
      posture as episode_store: no default `episodes_dir`/`output_path`
      here -- see sample/hello_world/backend/README.md for a worked
      example, the same relationship it has to a sample's own assembler's
      rebuild_catalog. Regenerable from the corpus at any time.
  jepa:
    role: >
      NOT YET BUILT. The agent that does the implementation job (Phase 5
      Generate, and the Diagnose/Plan phases that precede it) -- improved
      from the dataset_builder's output, so each cycle's Diagnose/Plan/
      Generate steps benefit from every prior one (Phase 9 "Return state"
      made cumulative across cycles, not just sequential within one).
