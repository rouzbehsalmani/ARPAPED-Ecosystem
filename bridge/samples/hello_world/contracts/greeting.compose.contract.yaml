# Sample contract artifact, valid against schemas/component-contract.schema.json.
# Part of the hello-world sample (../README.md).
#
# The second capability here, added to prove capability-to-capability
# calls: declares console.write as a dependency, pinned to the version
# it was built against (dependencies.capabilities below); its manifest
# sets executor_kind: factory for live, Bridge-routed access, always
# resolved at exactly this pin (2-RULES.md R4). Scaffolding — copy the
# shape, not the domain content.
contract:
  identity:
    id: greeting.compose
    name: Greeting Compose
    version: "1.0.0"
    domain: greeting
    family: greeting
    type: capability
  responsibility:
    description: Composes a greeting message for a name and writes it via console.write.
    invariants:
      - does not modify its input
  versions:
    "1.0.0":
      operations:
        - name: compose
          description: Builds a greeting for the given name and writes it to the console.
          input:
            - name: name
              type: string
              required: true
              pattern: "\\S"
              description: Name to greet.
          output:
            type: object
            description: Empty object on success.
          errors: []
  dependencies:
    capabilities:
      - capability_id: console.write
        contract_version: ">=1.0.0,<2.0.0"
    components: []
    resources: []
  discoverability:
    tags: [greeting]
    metadata: {}
  versioning:
    compatibility: backward
    deprecation_policy: none
  lineage:
    created_by: walkthrough-sample
    changed_by: walkthrough-sample
    history: []
