# Sample contract artifact, valid against schemas/component-contract.schema.json.
# Part of the hello-world sample (../README.md), following
# 0-WALKTHROUGH.md step 3's layout. Scaffolding — copy the shape, not
# the domain content.
#
# Two versions, both alive, both peers under `versions`: 1.0.0's `text`
# was renamed to `message` in 2.0.0 (a real breaking change). Neither is
# demoted to lineage.history -- that's for versions actually dead
# (2-RULES.md R2). 1.0.0's implementation (../capabilities/console/write/)
# stays registered alongside 2.0.0's (.../write_v2/); greeting.compose
# pins <2.0.0 and is unaffected by 2.0.0 existing.
contract:
  identity:
    id: console.write
    name: Console Write
    version: "2.0.0"
    domain: console
    family: console
    type: capability
  responsibility:
    # Version-neutral: describes the capability as a whole, never a
    # specific version's field names (see `versions` below for those).
    description: Writes a line of output to the console.
    invariants:
      - does not modify its input
  versions:
    "1.0.0":
      operations:
        - name: write
          description: Writes text to the console.
          input:
            - name: text
              type: string
              required: true
              description: Text to write.
          output:
            type: object
            description: Empty object on success.
          errors: []
    "2.0.0":
      operations:
        - name: write
          description: Writes a message to the console, optionally formatted.
          input:
            - name: message
              type: string
              required: true
              description: Message to write.
            - name: format
              type: string
              required: false
              default: plain
              enum: [plain, uppercase, prefixed]
              description: How to render the message before writing it -- "plain" (default), "uppercase", or "prefixed" (prefixed with "[console.write] "). Not available in 1.0.0.
          output:
            type: object
            description: Empty object on success.
          errors:
            - code: INVALID_INPUT
              description: format is not one of "plain", "uppercase", "prefixed".
  dependencies:
    capabilities: []
    components: []
    resources: []
  discoverability:
    tags: [console]
    metadata: {}
  versioning:
    compatibility: backward
    deprecation_policy: none
  lineage:
    created_by: walkthrough-sample
    changed_by: walkthrough-sample
    history: []
