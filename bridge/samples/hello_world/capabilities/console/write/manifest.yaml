# Sample capability manifest, valid against schemas/capability-manifest.schema.json.
# Co-located with its executor, per R3.
#
# priority: 100, no default (2-RULES.md "The Registry contract") --
# ../write_v2/manifest.yaml (2.0.0, the contract's default version)
# states a higher number so it wins an unpinned resolve; 1.0.0 stays
# alive for anyone who explicitly pins it.
capability_id: console.write
contract: bridge/samples/hello_world/contracts/console.write.contract.yaml
contract_version: "1.0.0"
implementations:
  - implementation_id: console.write.default
    version: "1.0.0"
    operations: [write]
    executor: bridge.samples.hello_world.capabilities.console.write.executor:execute
    priority: 100
