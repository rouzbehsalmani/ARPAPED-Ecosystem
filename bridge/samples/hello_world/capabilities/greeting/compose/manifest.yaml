# Sample capability manifest, valid against schemas/capability-manifest.schema.json.
# Co-located with its executor, per R3.
#
# executor_kind: factory -- this capability declares console.write as a
# dependency (../../../contracts/greeting.compose.contract.yaml) and
# needs live access to it, so its executor is a factory: (dependencies)
# -> executor, invoked once at assembly time. See executor.py.
capability_id: greeting.compose
contract: bridge/samples/hello_world/contracts/greeting.compose.contract.yaml
contract_version: "1.0.0"
implementations:
  - implementation_id: greeting.compose.default
    version: "1.0.0"
    operations: [compose]
    executor: bridge.samples.hello_world.capabilities.greeting.compose.executor:make_executor
    executor_kind: factory
    priority: 100
