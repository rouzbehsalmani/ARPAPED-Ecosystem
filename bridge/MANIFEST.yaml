# Authoritative, language-agnostic descriptor of this ecosystem's canonical
# Bridge. Docs never name a file, class, or import path directly — they
# point here instead. If this Bridge is ever reimplemented in a different
# language or restructured, update ONLY this file (and the implementation
# itself); no document elsewhere in this Blueprint needs to change.
#
# Schemas are NOT listed here: contract/manifest/protocol shapes are pure
# data-structure definitions, not coupled to the Bridge's implementation
# language, so they live in the stable top-level `schemas/` and never move
# or change just because this file's contents do. `samples/` (below) IS
# concrete to this Bridge's implementation and gets rewritten alongside it.
bridge:
  execution_boundary:
    location: bridge/bridge.py
    role: >
      Routes a request through registry discovery -> policy -> selector ->
      executor and returns a trace. There is exactly one canonical Bridge.
      Once a candidate is selected, validates the request's input against
      the operation's contract-declared shape (required fields, declared
      types, declared defaults) before any executor runs, in any language
      (2-RULES.md "No silent defaults on what resolution depends on").
      Each trace stage is observable live via handle's on_stage callback;
      handle_with_timeout runs under a bounded per-stage timeout instead
      of an unbounded wait, raising BRIDGE_STAGE_TIMEOUT with whatever
      partial trace was observed (2-RULES.md R5) — for verification in an
      unattended pipeline with nobody to notice or interrupt a hung call.
  registry:
    location: bridge/registry.py
    role: >
      Canonical discovery/index service: capability+operation -> bounded
      implementation candidates. Supports the 5-level discovery cascade
      (Exact -> Scoped -> Family -> Domain -> Cross-domain; see
      `discover_cascade` and 2-RULES.md "Registry contract").
  policy:
    location: bridge/policy.py
    role: >
      Canonical authorization stage that evaluates each candidate against
      the request's policy context.
  selector:
    location: bridge/selector.py
    role: >
      Canonical routing stage that picks which allowed candidate executes
      (with failover awareness).
  assembler:
    location: bridge/assembler.py
    role: >
      Generic Publish-phase helper: reads capability manifests, imports
      each executor, builds implementation records (including each
      operation's contract-recorded input shape, later enforced by the
      Bridge above), and registers them into the canonical Registry.
      Builds and consumes the generated capability catalog
      (append_to_catalog, rebuild_catalog, assemble_from_catalog; see
      schemas/capability-catalog.schema.json) so neither discovery nor
      runtime bootstrap has to re-walk every manifest. executor_kind:
      factory is invoked once with a Dependencies scoped to the
      contract's declared dependencies.capabilities (2-RULES.md R4),
      after verifying the dependency graph is acyclic (R5).
      executor_kind: process spawns the named program instead of
      importing anything (bridge/process_executor.py), verified to have
      actually started before registering it (R5) — how a capability can
      be implemented in another language.

samples:
  location: bridge/samples/
  contents:
    - hello_world   # a single, real, runnable console app — see its README.md
